version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: heyform
build:
  toolchains: []
  run_buildscript: false
images:
  - id: heyform
    target: service
    service: heyform
    source: heyform/community-edition
    channel: stable
    sort: semver
    # Upstream tags carry a "v" prefix (v3.0.6), so the optional v is required:
    # without it no candidate matches and the action fails with VERSION_NOT_FOUND.
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: HeyForm
    skip_if_version_exists: true
